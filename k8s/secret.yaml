# This file defines the secret structure only.
# Real values are injected at deploy time from your local .env file
# (which is in .gitignore) or from CI/CD credentials.
#
# DO NOT put real secrets here — they would be committed to git.
---
apiVersion: v1
kind: Secret
metadata:
  name: void-secret
  namespace: void-backend
type: Opaque
stringData: {}
